---
name: sar
on:
  workflow_dispatch: {}
  push:
    paths:
      - sar/**
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  setup:
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-setup-env.yaml@v1.2.1
    with:
      tagname: ${{ github.ref_name }}
  build_image:
    needs:
      - setup
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-docker-build.yaml@v1.2.1
    with:
      image-name: deployment-opensarlab-container_sar
      dockerfile: sar/Dockerfile
      push-to-aws: true