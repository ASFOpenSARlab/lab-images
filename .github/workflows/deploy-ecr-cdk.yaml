---
name: Deploy ECR CDK 
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      cdk_deploy_env:
        type: choice
        description: Deploy this branch to which maturity?
        options:
          - 'default'
          - 'test'
          - 'prod'
  push:
    paths:
      - "ecr-cdk/**"
      # Or changes to this action:
      - .github/workflows/deploy-ecr-cdk.yaml
    branches:
      - main
    tags:
      - "v*.*.*"
permissions:
  contents: read
  packages: read
env:
  cdk_image: ghcr.io/asfopensarlab/cdk-env
  JSII_RUNTIME_PACKAGE_CACHE: disabled
jobs:
  setup:
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-setup-env.yaml@v1.2.2
    with:
      tagname: ${{ inputs.tagname || github.ref_name }}
  use-cdk-image:
    # Skip this step if env=dev and input.cdk_deploy_env=default
    if: |
      !(
        inputs.cdk_deploy_env == 'default' &&
        needs.setup.outputs.environment == 'dev'
      )
    env:
      image-tag: ${{ needs.setup.outputs.branchtag }}
      # Allow cdk_deploy_env to override deploy_prefix for deploy
      DEPLOY_PREFIX: >-
        ${{
          inputs.cdk_deploy_env == 'test' && 'test' ||
          inputs.cdk_deploy_env == 'prod' && 'prod' ||
          needs.setup.outputs.deploy_prefix
        }}
      LAB_IMAGE_NAMES: "${{ vars.LAB_IMAGE_NAMES }}"
    runs-on: ubuntu-latest
    container: ghcr.io/asfopensarlab/osl-utils:v1.2.2
    needs:
      - setup
    # Allow cdk_deploy_env to override environment for deploy
    environment: >-
      ${{ inputs.cdk_deploy_env == 'test' && 'test' ||
        inputs.cdk_deploy_env == 'prod' && 'prod' ||
        needs.setup.outputs.environment
      }}
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{vars.AWS_ACCOUNT_NUMBER}}:role/${{vars.OIDC_IAM_ROLE}}
          aws-region: ${{vars.AWS_DEFAULT_REGION}}
      - name: Deploy ECR
        id: deploy-ecr
        run: |-
          echo "Hello from inside ecr-cdk (${{ env.image-tag }})"
          pwd && ls
          cd ./ecr-cdk && cdk --require-approval never deploy
