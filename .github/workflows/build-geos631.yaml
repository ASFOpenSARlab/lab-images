---
name: geos631 - Foundations of Geophysics
on:
  workflow_dispatch: {}
  push:
    paths:
      - geos631/**
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  setup:
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-setup-env.yaml@670624f6f989fde357eca48856717d68b79f76460ffa69739d91bdb8230c8787
    with:
      tagname: ${{ github.ref_name }}
  build_image:
    needs:
      - setup
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-docker-build.yaml@670624f6f989fde357eca48856717d68b79f76460ffa69739d91bdb8230c8787
    with:
      image-name: geos631
      dockerfile: geos631/Dockerfile
      push-to-aws: true
      use-oidc: true
      role-to-assume: ${{ vars.OIDC_ROLE_ARN }}