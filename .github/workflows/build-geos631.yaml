---
name: Deploy Cluster CDK
on:
  workflow_dispatch: {}
  push:
    paths:
      - geos631/**
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  setup:
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-setup-env.yaml@v1.2.1
    with:
      tagname: ${{ inputs.tag_override || github.ref_name }}
  build_image:
    needs:
      - setup
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-docker-build.yaml@v1.2.1
    with:
      image-name: geos631
      dockerfile: geos631/Dockerfile
      build-args: JUPYTERHUB_HUB_HELM_VERSION=${{ vars.JUPYTERHUB_HUB_HELM_VERSION || '4.3.5' }}