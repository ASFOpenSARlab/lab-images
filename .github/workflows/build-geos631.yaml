---
name: geos631 - Foundations of Geophysics
on:
  workflow_dispatch: {}
  push:
    paths:
      - geos631/**
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  
jobs:
  setup:
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-setup-env.yaml@sha256:9d22052a76376d8105f19e1c3a2588c31b4b175c68da5f789b8aa568daebe7d1
    with:
      tagname: ${{ github.ref_name }}
  build_image:
    needs:
      - setup
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-docker-build.yaml@sha256:9d22052a76376d8105f19e1c3a2588c31b4b175c68da5f789b8aa568daebe7d1
    with:
      image-name: geos631
      dockerfile: geos631/Dockerfile
      push-to-aws: true
      use-oidc: true
      role-to-assume: ${{ vars.OIDC_ROLE_ARN }}