[workspace]
authors = ["segallagher <segallagher@alaska.edu>"]
channels = ["conda-forge"]
name = "opensarlab"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
### Install plotting and general
awscli = ">=2.38.4,<3"
boto3 = ">=1.44.4,<2"
pyyaml = ">=6.0.3,<7"
bokeh = ">=3.10.0,<4"
plotly = ">=7.1.0,<8"
pyopenssl = ">=23.0.0"
zstandard = "==0.25.0"
### Install jupyter libaries
kernda = ">=0.3.0,<0.4"
jupyter-resource-usage = ">=1.3.0,<2"
nb_conda_kernels = ">=2.5.1,<3"
jupyterlab-spellchecker = ">=0.9.0,<0.10"
ipympl = ">=0.10.0,<0.11"
jupyterlab-h5web = ">=12.9.0,<13"
jupyterlab_widgets = ">=3.0.17,<4"
ipywidgets = ">=8.1.9,<9"
jupyterlab-git = ">=0.55.0,<0.56"
jupyterhub = ">=5.4.6"
jupyter_server = ">=2.18.0"
panel = ">=1.10.0,<2"
distributed = ">=2026.8.0,<2027"
ipyleaflet = ">=0.20.0,<0.21"
jupyter-collaboration = ">=4.4.0"
jupyter-collaboration-ui = ">=2.4.0"
jupytergis = ">=0.15.0,<0.16"
ipykernel = ">=7.4.0,<8"
# jupyter-ai = ">=3.2.0,<4"

[pypi-dependencies]
### Dask
dask = { version = "*", extras = ["complete"] }
dask-gateway = ">=2026.3.0, <2027"
### For ASF
url-widget = ">=0.0.0, <0.0.1"
opensarlab-frontend = "==1.5.4"
jb-toc = ">=2.0.1, <3"
nbgitpuller-jl-interface = "==1.1.1"
opensciencelab-tours = "==0.3.2"
mystmd = ">=1.13.0, <2"
jupyterlab-myst = ">=2.7.0, <3"
playwright = ">=1.65.2, <2"
### For pyGMTSAR
pygmtsar = ">=2025.4.8.post1, <2026"
